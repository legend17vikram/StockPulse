{% extends 'login/loginBase.html' %}

{% block website %}
<div class="min-h-[80vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <h2 class="text-center text-4xl font-extrabold tracking-tight text-white mb-2">
            Welcome Back
        </h2>
        <p class="text-center text-sm text-slate-400">
            Simulate, learn, and master the markets with StockPulse.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4">
        <div class="bg-slate-800 py-8 px-4 border border-slate-700 shadow-xl rounded-xl sm:px-10">
            <form class="space-y-6" action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300 mb-2">
                        Username
                    </label>
                    
                    <div class="{{isusername}} flex items-center p-3 mb-4 text-sm text-red-400 rounded-lg bg-red-950/50 border border-red-800" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <span>Username does not exist.</span>
                    </div>

                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 ps-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <input type="text" name="username" id="username" autocomplete="username" required
                            class="block w-full ps-10 sm:text-sm bg-slate-900 border-slate-700 rounded-lg text-white"
                            placeholder="username">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
                        Password
                    </label>
                    
                    <div class="{{ispasswordcorrect}} flex items-center p-3 mb-4 text-sm text-red-400 rounded-lg bg-red-950/50 border border-red-800" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <span>Incorrect password.</span>
                    </div>

                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 ps-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" name="password" id="password" autocomplete="current-password" required
                            class="block w-full ps-10 sm:text-sm bg-slate-900 border-slate-700 rounded-lg text-white"
                            placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-purple-600 hover:bg-purple-700 transition duration-150">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center text-sm">
                <span class="text-slate-400">New to StockPulse?</span>
                <a href="/signup" class="font-medium text-cyan-400 hover:text-cyan-300 ms-1 transition duration-150">
                    Create an account
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
