{% extends 'main/dashboardbase.html' %}

{% block dashboard %}
<script>
    // Configuration
    const symbol = "{{stocklist|escapejs}}";
    const start = "{{start|escapejs}}";
    const end = "{{end|escapejs}}";
    const watchquery = "{{watchlist}}";

    // Parse symbols
    const symbols = JSON.parse(symbol.replace(/'/g, '"'));
    let chart = null;
    let selectedSymbol = null;
    let isFetching = false;

    // DOM Elements (will be initialized after DOM loads)
    let chartContainer;
    let priceDisplay;
    let stocksTableBody;

    // UI States
    function showInitialState() {
        if (!chartContainer || !priceDisplay) return;
        
        clearChart();
        chartContainer.innerHTML = `
            <div class="p-6 text-center text-gray-500 dark:text-gray-400">
                Click on a stock from your watchlist to view its chart
            </div>
        `;
        priceDisplay.textContent = "No stock selected";
    }

    function showLoadingState(symbol) {
        if (!chartContainer || !priceDisplay) return;
        
        clearChart();
        chartContainer.innerHTML = `
            <div class="p-6 text-center text-gray-500 dark:text-gray-400">
                Loading ${symbol} chart...
            </div>
        `;
        priceDisplay.textContent = `${symbol} — Loading...`;
    }

    function showErrorState(symbol) {
        if (!chartContainer || !priceDisplay) return;
        
        clearChart();
        chartContainer.innerHTML = `
            <div class="p-6 text-center text-red-500 dark:text-red-400">
                No data available for ${symbol}
            </div>
        `;
        priceDisplay.textContent = `${symbol} — Data unavailable`;
    }

    function clearChart() {
        if (chart) {
            chart.destroy();
            chart = null;
        }
        if (chartContainer) {
            chartContainer.innerHTML = '';
        }
    }

    // Fetch data for single symbol
    async function fetchStockData(symbol) {
        try {
            console.log(`[fetchStockData] Triggered for: ${symbol}`);
            // Return null immediately if we shouldn't fetch
            if (isFetching || selectedSymbol === symbol) {
                console.log(`[fetchStockData] Skipped fetch: isFetching=${isFetching}, selectedSymbol=${selectedSymbol}`);
                return null;
            }
            
            isFetching = true;
            selectedSymbol = symbol;
            showLoadingState(symbol);

            const url = `/api/graphdata/${symbol}/${start}/${end}`;
            console.log(`[fetchStockData] Querying url: ${url}`);

            // Use a silent fetch wrapper
            const response = await fetch(url)
                .catch((err) => {
                    console.error(`[fetchStockData] fetch error:`, err);
                    return null;
                });
                
            if (!response?.ok) {
                console.error(`[fetchStockData] response failed or not ok:`, response);
                return null;
            }
            
            const data = await response.json().catch((err) => {
                console.error(`[fetchStockData] JSON decoding failed:`, err);
                return null;
            });
            console.log(`[fetchStockData] decoded response data:`, data);
            
            if (!data?.date?.length || !data?.close?.length) {
                console.warn(`[fetchStockData] Empty dataset arrays returned from backend.`);
                return null;
            }
            
            return data;
        } finally {
            isFetching = false;
        }
    }

function renderChart(symbol, data) {
    console.log(`[renderChart] rendering chart for: ${symbol}`);
    if (!chartContainer || !priceDisplay) {
        console.error(`[renderChart] Missing target DOM containers!`);
        return;
    }
    
    clearChart();
    
    // Convert date strings to timestamps
    const timestamps = data.date.map(dateStr => new Date(dateStr).getTime());
    const closes = data.close;
    const lastClose = closes[closes.length - 1];
    const firstClose = closes[0];
    const trendColor = lastClose >= firstClose ? '#10b981' : '#f43f5e';

    const options = {
        series: [{
            name: symbol,
            data: closes.map((close, index) => ({
                x: timestamps[index],
                y: close
            })),
            color: trendColor
        }],
        chart: {
            height: "100%",
            width: "100%",
            type: "area",
            toolbar: { show: false },
            animations: {
                enabled: true,
                easing: 'easeinout',
                speed: 800
            },
            // Disable the floating price label
            events: {
                mouseMove: function(event, chartContext, config) {
                    // This prevents the default price label behavior
                    return false;
                }
            }
        },
        xaxis: {
            type: 'datetime',
            labels: {
                style: {
                    fontSize: '10px',
                    cssClass: 'font-normal fill-gray-500 dark:fill-gray-400'
                },
                formatter: function(value) {
                    const date = new Date(value);
                    const day = date.getDate();
                    const month = date.toLocaleString('default', { month: 'short' });
                    return `${month} ${day}`;
                }
            },
            axisBorder: { show: false },
            axisTicks: { show: false }
        },
        yaxis: {
            labels: {
                formatter: function(value) {
                    if (value >= 1000) return '$' + (value/1000).toFixed(1) + 'K';
                    if (value >= 100) return '$' + value.toFixed(0);
                    return '$' + value.toFixed(2);
                },
                style: {
                    fontSize: '10px',
                    cssClass: 'font-normal fill-gray-500 dark:fill-gray-400'
                }
            },
            tickAmount: 6
        },
        tooltip: {
            enabled: true,
            x: {
                formatter: function(value) {
                    return new Date(value).toLocaleString('en-US', {
                        weekday: 'short',
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            },
            y: {
                formatter: function(value) {
                    return '$' + value.toFixed(2);
                },
                title: {
                    formatter: () => 'Price: '
                }
            },
            // Ensure tooltip stays clean without the floating label
            fixed: {
                enabled: true,
                position: 'topRight'
            }
        },
        stroke: { 
            width: 2,
            curve: 'smooth'
        },
        fill: {
            type: "gradient",
            gradient: {
                shadeIntensity: 0.5,
                opacityFrom: 0.4,
                opacityTo: 0.1,
                stops: [0, 90, 100]
            }
        },
        markers: {
            size: closes.length > 50 ? 0 : 3
        },
        // Disable the default floating value label
        dataLabels: {
            enabled: false
        }
    };

    // Update the separate price display element instead
    const percentChange = ((lastClose - firstClose) / firstClose * 100).toFixed(2);
    priceDisplay.innerHTML = `
        ${symbol} — $${lastClose.toFixed(2)}
        <span class="${lastClose >= firstClose ? 'text-green-500' : 'text-red-500'}">
            (${percentChange}%)
        </span>
    `;

    console.log(`[renderChart] Rendering ApexCharts inside container:`, chartContainer);
    chart = new ApexCharts(chartContainer, options);
    console.log(`[renderChart] Calling chart.render()...`);
    chart.render();
    console.log(`[renderChart] Render complete!`);
}

    let currentSymbol = null;

    function toggleRightPanel(view) {
        const chartDiv = document.getElementById("labels-chart");
        const tradeDiv = document.getElementById("trade-frame-container");
        const chartBtn = document.getElementById("btn-show-chart");
        const tradeBtn = document.getElementById("btn-show-trade");
        const iframe = document.getElementById("trade-iframe");

        if (view === 'chart') {
            if (chartDiv) chartDiv.classList.remove('hidden');
            if (tradeDiv) tradeDiv.classList.add('hidden');
            if (chartBtn) {
                chartBtn.classList.add('bg-blue-600');
                chartBtn.classList.remove('bg-gray-600');
            }
            if (tradeBtn) {
                tradeBtn.classList.add('bg-gray-600');
                tradeBtn.classList.remove('bg-blue-600');
            }
        } else {
            if (chartDiv) chartDiv.classList.add('hidden');
            if (tradeDiv) tradeDiv.classList.remove('hidden');
            if (tradeBtn) {
                tradeBtn.classList.add('bg-blue-600');
                tradeBtn.classList.remove('bg-gray-600');
            }
            if (chartBtn) {
                chartBtn.classList.add('bg-gray-600');
                chartBtn.classList.remove('bg-blue-600');
            }
            if (currentSymbol && iframe) {
                iframe.src = `/details/${currentSymbol}?embed=true`;
            }
        }
    }

    // Handle stock selection
    async function handleStockSelect(symbol) {
        console.log(`[handleStockSelect] User clicked stock symbol: ${symbol}`);
        currentSymbol = symbol;
        const toggleContainer = document.getElementById("panel-toggle-container");
        if (toggleContainer) {
            toggleContainer.classList.remove("hidden");
        }
        
        // If we are currently showing the trade frame, update its source
        const tradeDiv = document.getElementById("trade-frame-container");
        if (tradeDiv && !tradeDiv.classList.contains("hidden")) {
            const iframe = document.getElementById("trade-iframe");
            if (iframe) {
                console.log(`[handleStockSelect] Dynamically updating iframe source to: /details/${symbol}?embed=true`);
                iframe.src = `/details/${symbol}?embed=true`;
            }
        }

        const data = await fetchStockData(symbol);
        if (data) {
            renderChart(symbol, data);
        } else {
            console.warn(`[handleStockSelect] Fetch failed or returned no data for ${symbol}. Resetting view to error state.`);
            showErrorState(symbol);
        }
    }

    // Update watchlist table
    async function updateWatchlist() {
        if (!stocksTableBody) return;
        
        try {
            const response = await fetch(`/api/watchlist/${watchquery}`);
            if (!response.ok) throw new Error('Failed to fetch watchlist');
            

            const data = await response.json();
            if (!data.stocks || data.stocks.length === 0) {
                stocksTableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="px-6 py-10 text-center text-slate-500 text-xs font-semibold">
                            <i class="fa-solid fa-folder-open text-xl mb-1.5 block text-slate-600"></i>
                            Watchlist is empty.<br>Search above to add stocks!
                        </td>
                    </tr>
                `;
                return;
            }
            stocksTableBody.innerHTML = data.stocks.map(stock => {
                const [symbol, price, change] = stock;
                const isActive = selectedSymbol === symbol;
                const changeClass = change > 0 ? 'text-emerald-400' : 'text-rose-500';
                const changeIcon = change > 0 ? '<i class="fa-solid fa-arrow-trend-up me-1"></i>' : '<i class="fa-solid fa-arrow-trend-down me-1"></i>';
                
                return `
                    <tr class="hover:bg-slate-800/40 transition duration-150 ${isActive ? 'bg-slate-800/80 border-l-2 border-purple-500' : ''}">
                        <th scope="row" class="px-6 py-4 font-semibold text-white whitespace-nowrap">
                            <button class="symbol-button ${isActive ? 'text-cyan-400 font-bold' : 'text-slate-200'} hover:text-cyan-400 transition" 
                                    onclick="handleStockSelect('${symbol}')">
                                ${symbol}
                            </button>
                        </th>
                        <td class="px-6 py-4 font-medium text-slate-100">$${parseFloat(price).toFixed(2)}</td>
                        <td class="px-6 py-4 font-semibold ${changeClass}">
                            ${changeIcon}${change}%
                        </td>
                        <td class="px-2 py-4">
                            <a href="/removewatchlist/${symbol}" 
                            class="font-medium text-slate-400 hover:text-red-400 transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');
        } catch (error) {
            console.error("Failed to update watchlist:", error);
            if (stocksTableBody) {
                stocksTableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="px-6 py-4 text-center text-red-500">
                            Failed to load watchlist
                        </td>
                    </tr>
                `;
            }
        }
    }

    // Call every 2 seconds
    setInterval(updateWatchlist, 2000);
    // Initialization
    document.addEventListener('DOMContentLoaded', async () => {
        // Initialize DOM references
        chartContainer = document.getElementById("labels-chart");
        priceDisplay = document.getElementById("watchstockprice");
        stocksTableBody = document.getElementById("stocksTableBody");
        
        if (!chartContainer || !priceDisplay || !stocksTableBody) {
            console.error("Required DOM elements not found");
            return;
        }
        
        showInitialState();
        await updateWatchlist();
        
        // Make function available globally for HTML onclick
        window.handleStockSelect = handleStockSelect;
    });
</script>

<style>

  </div>

  <!-- Row 2: Portfolio + Assets Allocation -->
  <div class="flex flex-col lg:flex-row gap-6 w-full">
    
    <!-- Portfolio -->
    <div class="flex flex-col h-[400px] rounded-xl bg-slate-900 border border-slate-800 overflow-hidden shadow-lg flex-1">
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <h5 class="text-sm font-bold tracking-wider uppercase text-slate-300 flex items-center">
            <i class="fa-solid fa-briefcase text-purple-400 me-2"></i>
            Portfolio Holdings
        </h5>
      </div>
      <div class="flex-grow overflow-y-auto p-4 hide-scrollbar">
        <div class="h-full overflow-y-auto hide-scrollbar rounded-lg border border-slate-800">
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-slate-400 uppercase bg-slate-950">
              <tr>
                <th class="px-6 py-3">Symbol</th>

    <!-- Donut Chart -->

    <script>
        fetch(`/api/portfoliochart`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                const getChartOptions = () => {
                    return {
                        series: data.price,
                        colors: ["#d97706", "#eab308", "#10b981", "#3b82f6", "#ec4899", "#6b7280"],
                        chart: {
                            height: 320,
                            width: "100%",
                            type: "donut",
                        },
                        stroke: {
                            colors: ["transparent"],
                            lineCap: "",
                        },
                        plotOptions: {
                            pie: {
                                donut: {
                                    labels: {
                                        show: true,
                                        name: {
                                            show: true,
                                            fontFamily: "Inter, sans-serif",
                                            offsetY: 20,
                                        },
                                        total: {
                                            showAlways: true,
                                            show: true,
                                            label: "Total Investment",
                                            fontFamily: "Inter, sans-serif",
                                            formatter: function (w) {
                                                const sum = w.globals.seriesTotals.reduce((a, b) => {
                                                    return a + b
                                                }, 0)
                                                return '$' + sum
                                            },
                                        },
                                        value: {
                                            show: true,
                                            fontFamily: "Inter, sans-serif",
                                            offsetY: -20,
                                            formatter: function (value) {
                                                return value
                                            },
                                        },
                                    },
                                    size: "80%",
                                },
                            },
                        },
                        grid: {
                            padding: {
                                top: -2,
                            },
                        },
                        labels: data.name,
                        dataLabels: {
                            enabled: false,
                        },
                        legend: {
                            position: "bottom",
                            fontFamily: "Inter, sans-serif",
                        },
                        yaxis: {
                            labels: {
                                formatter: function (value) {
                                    return value
                                },
                            },
                        },
                        xaxis: {
                            labels: {
                                formatter: function (value) {
                                    return value
                                },
                            },
                            axisTicks: {
                                show: false,
                            },
                            axisBorder: {
                                show: false,
                            },
                        },
                    }
                }

                if (document.getElementById("donut-chart") && typeof ApexCharts !== 'undefined') {
                    const chart = new ApexCharts(document.getElementById("donut-chart"), getChartOptions());
                    chart.render();

            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);

    </script>

    <script>
    function fetchAndRenderPortfolio() {
        fetch(`/api/portfolio`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                const tableBody = document.getElementById('stock-table-body');

                // Clear the table before adding new rows
                tableBody.innerHTML = '';

                data.forEach(stock => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-800/40 transition duration-150';

                    // Symbol
                    const symbolCell = document.createElement('th');
                    symbolCell.className = 'px-6 py-4 font-semibold text-white whitespace-nowrap';
                    symbolCell.textContent = stock.symbol;

                    // Count (Quantity)
                    const quantityCell = document.createElement('td');
                    quantityCell.className = 'px-6 py-4 text-slate-200';
                    quantityCell.textContent = stock.quantity;

                    // Average Price
                    const averagePriceCell = document.createElement('td');
                    averagePriceCell.className = 'px-6 py-4 text-slate-200';
                    averagePriceCell.textContent = '$' + parseFloat(stock.averageprice).toFixed(2);

                    // Current Price
                    const currentPriceCell = document.createElement('td');
                    currentPriceCell.className = 'px-6 py-4 text-slate-200';
                    currentPriceCell.textContent = '$' + parseFloat(stock.currentprice).toFixed(2);

                    // Percent Change
                    const diff = ((parseFloat(stock.currentprice) - parseFloat(stock.averageprice)) / parseFloat(stock.averageprice)) * 100;
                    const percentChangeCell = document.createElement('td');
                    percentChangeCell.className = 'px-6 py-4 font-semibold';
                    
                    if (diff > 0) {
                        percentChangeCell.className += ' text-emerald-400';
                        percentChangeCell.innerHTML = `<i class="fa-solid fa-arrow-trend-up me-1"></i>${diff.toFixed(2)}%`;
                    } else if (diff < 0) {
                        percentChangeCell.className += ' text-rose-500';
                        percentChangeCell.innerHTML = `<i class="fa-solid fa-arrow-trend-down me-1"></i>${diff.toFixed(2)}%`;
                    } else {
                        percentChangeCell.className += ' text-slate-400';
                        percentChangeCell.textContent = '0.00%';
                    }

                    // Edit Action
                    const actionsCell = document.createElement('td');
                    actionsCell.className = 'px-6 py-4';
                    const editLink = document.createElement('a');
                    editLink.href = 'details/' + stock.symbol;
                    editLink.className = 'inline-flex items-center text-cyan-400 hover:text-cyan-300 font-semibold transition';
                    editLink.innerHTML = `<i class="fa-solid fa-pen-to-square me-1.5"></i>Trade`;
                    actionsCell.appendChild(editLink);

                    // Append all cells to the row
                    row.appendChild(symbolCell);
                    row.appendChild(quantityCell);
                    row.appendChild(averagePriceCell);
                    row.appendChild(currentPriceCell);
                    row.appendChild(percentChangeCell);
                    row.appendChild(actionsCell);

                    // Append row to the table body
                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });
    }

    document.addEventListener('DOMContentLoaded', function () {
        fetchAndRenderPortfolio();              // initial call immediately
        setInterval(fetchAndRenderPortfolio, 1500); // repeat every 2 seconds
    });
</script>
