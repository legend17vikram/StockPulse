{% extends 'main/dashboardbase.html' %}

{% block dashboard %}
<div class="min-h-[70vh] flex flex-col justify-center py-6 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-slate-900 py-8 px-6 border border-slate-800 shadow-xl rounded-xl sm:px-10 max-w-md mx-auto text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-950 border border-red-700 mb-4">
                <i class="fa-solid fa-circle-exclamation text-red-500 text-xl"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">Authentication Error</h3>
            <p class="text-sm text-slate-400 mb-6">You must be logged in to view this page or perform this action.</p>
            
            <div class="flex flex-col space-y-2">
                <a href="/login" class="w-full flex justify-center py-2.5 px-4 rounded-lg text-sm font-semibold text-white bg-purple-600 hover:bg-purple-700 transition">
                    Sign In
                </a>
                <a href="/signup" class="w-full flex justify-center py-2.5 px-4 rounded-lg text-sm font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 transition border border-slate-700">
                    Create Account
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
