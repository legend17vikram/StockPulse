{% extends 'main/dashboardbase.html' %}

{% block dashboard %}
<div class="min-h-[70vh] flex flex-col justify-center py-6 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-slate-900 py-8 px-6 border border-slate-800 shadow-xl rounded-xl sm:px-10 max-w-md mx-auto">
            <form class="space-y-6" action="{% url 'settings' %}" method="POST">
                {% csrf_token %}
                <h3 class="text-xl font-bold text-white flex items-center mb-6">
                    <i class="fa-solid fa-key text-purple-400 me-2"></i>
                    Change Password
                </h3>
                
                <div>
                    <label for="currentpassword" class="block text-sm font-medium text-slate-300 mb-2">
                        Current Password
                    </label>
                    
                    <div class="{{currentcheck}} flex items-center p-3 mb-4 text-sm text-red-400 rounded-lg bg-red-950/50 border border-red-800" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <span>Incorrect current password.</span>
                    </div>

                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 ps-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="currentpassword" name="currentpassword" required
                            class="block w-full ps-10 sm:text-sm bg-slate-950 border-slate-800 rounded-lg text-white"
                            placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <label for="newpassword" class="block text-sm font-medium text-slate-300 mb-2">
                        New Password
                    </label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 ps-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock-open"></i>
                        </div>
                        <input type="password" id="newpassword" name="newpassword" required
                            class="block w-full ps-10 sm:text-sm bg-slate-950 border-slate-800 rounded-lg text-white"
                            placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <label for="repeat-password" class="block text-sm font-medium text-slate-300 mb-2">
                        Repeat New Password
                    </label>
                    
                    <div class="{{matchcheck}} flex items-center p-3 mb-4 text-sm text-red-400 rounded-lg bg-red-950/50 border border-red-800" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <span>New passwords do not match.</span>
                    </div>

                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 ps-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="repeat-password" name="repeat-password" required
                            class="block w-full ps-10 sm:text-sm bg-slate-950 border-slate-800 rounded-lg text-white"
                            placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-purple-600 hover:bg-purple-700 transition duration-150">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
